name: Smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Smoke scripts use only Node fetch — no node_modules required.
      - run: node scripts/facilitator-smoke-test.js https://reachforthestars.today
      - run: node scripts/production-smoke-test.js https://reachforthestars.today
